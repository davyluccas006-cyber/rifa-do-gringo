<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel - Rifa do Gringo</title><style>
body{margin:0;background:#070707;color:#fff;font-family:Arial;padding:20px}.box{max-width:700px;margin:auto;background:#111;border:1px solid #765c1c;border-radius:16px;padding:22px}h1{color:#f2cf70}input,button{padding:13px;border-radius:9px;border:1px solid #765c1c;margin:5px;background:#181818;color:white}button{background:#d8ad45;color:#000;font-weight:bold;cursor:pointer}.row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #333;padding:10px 0}.msg{color:#f2cf70;margin:10px 0}</style></head><body><div class="box"><h1>Painel — Rifa do Gringo</h1><div id="login"><input id="pw" type="password" placeholder="Senha administrativa"><button onclick="login()">Entrar</button></div><div id="app" style="display:none"><input id="q" maxlength="5" placeholder="Número da cota"><button onclick="confirmar()">CONFIRMAR COMPRA</button><button onclick="liberar()">LIBERAR</button><div class="msg" id="m"></div><div id="list"></div></div></div><script>
let token="",q=document.querySelector("#q"),list=document.querySelector("#list"),m=document.querySelector("#m");
async function login(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.querySelector("#pw").value})});let j=await r.json();if(!j.ok)return m.textContent="Senha incorreta";token=j.token;document.querySelector("#login").style.display="none";document.querySelector("#app").style.display="block";load()}
async function act(url){let n=q.value.replace(/\D/g,"").padStart(5,"0");let r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({numero:n})});let j=await r.json();m.textContent=j.ok?"Cota "+n+" atualizada.":j.error;load()}
function confirmar(){act("/api/admin/confirmar")}function liberar(){act("/api/admin/liberar")}
async function load(){let r=await fetch("/api/admin/cotas",{headers:{Authorization:"Bearer "+token}});let a=await r.json();list.innerHTML=a.map(x=>`<div class="row"><span>${x.numero}</span><span>${x.status.toUpperCase()}</span></div>`).join("")}
</script></body></html>
