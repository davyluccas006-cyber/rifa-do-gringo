<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rifa do Gringo</title><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}header{text-align:center;padding:34px 14px;border-bottom:1px solid #765c1c}h1{color:#f2cf70;letter-spacing:2px;margin:0;font-size:clamp(32px,8vw,60px)}.sub{margin-top:9px;color:#ddd}.wrap{max-width:1200px;margin:auto;padding:18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.panel{background:#101010;border:1px solid #71571b;border-radius:16px;padding:18px}.card{text-align:center}.card b{display:block;color:#f2cf70;font-size:20px;margin-bottom:7px}.panel{margin-top:16px}.search{width:100%;padding:15px;border-radius:10px;border:1px solid #71571b;background:#181818;color:white;font-size:17px}.stats{padding:12px 0;color:#bbb}.stats strong{color:#f2cf70}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.cota{min-height:52px;border-radius:9px;border:1px solid #695018;background:#111;color:#f2cf70;font-weight:bold;cursor:pointer}.cota:hover{border-color:#f2cf70}.cota.comprada{color:#666;border-color:#333;background:#202020;cursor:not-allowed;text-decoration:line-through}.info{text-align:center;color:#999;font-size:13px;margin-top:15px}@media(max-width:800px){.cards{grid-template-columns:1fr}.grid{grid-template-columns:repeat(5,1fr)}}@media(max-width:430px){.grid{grid-template-columns:repeat(4,1fr);gap:6px}.cota{min-height:56px;font-size:13px}.wrap{padding:10px}}
</style></head><body><header><h1>RIFA DO GRINGO</h1><div class="sub">100.000 COTAS • R$ 1,00 CADA</div></header><main class="wrap"><section class="cards"><div class="card"><b>9 PRÊMIOS</b>R$ 150 cada</div><div class="card"><b>PRÊMIO</b>Kit de roupas + relógio + sapatos</div><div class="card"><b>PRÊMIO ESPECIAL</b>R$ 50.000</div></section><section class="panel"><input id="s" class="search" maxlength="5" inputmode="numeric" placeholder="Pesquisar cota..."><div class="stats">Disponíveis: <strong id="d">-</strong> · Compradas: <strong id="c">-</strong></div><div id="g" class="grid"></div><div class="info">Clique na cota disponível para falar no WhatsApp. Ela só ficará COMPRADA depois da confirmação pelo administrador.</div></section></main><script>
const g=document.querySelector("#g"),s=document.querySelector("#s"),d=document.querySelector("#d"),c=document.querySelector("#c");
function wa(n){location.href="https://wa.me/5571991538023?text="+encodeURIComponent("Olá! Quero comprar a cota "+n+" da Rifa do Gringo.")}
async function load(){let r=await fetch("/api/cotas"),j=await r.json();d.textContent=Number(j.stats.disponiveis).toLocaleString("pt-BR");c.textContent=Number(j.stats.compradas).toLocaleString("pt-BR");g.innerHTML="";j.cotas.forEach(x=>{let b=document.createElement("button");b.className="cota "+x.status;b.textContent=x.numero;b.onclick=()=>{if(x.status==="disponivel")wa(x.numero)};g.appendChild(b)})}
async function search(){let q=s.value.replace(/\D/g,"");if(!q)return load();let r=await fetch("/api/buscar/"+q),x=await r.json();g.innerHTML="";if(x.status==="inexistente")return;let b=document.createElement("button");b.className="cota "+x.status;b.textContent=x.numero;b.onclick=()=>{if(x.status==="disponivel")wa(x.numero)};g.appendChild(b)}
s.oninput=search;load();setInterval(load,5000);
</script></body></html>
